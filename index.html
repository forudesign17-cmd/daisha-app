<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>代車管理くん</title>
<script src="accounts.js"></script>
<script src="auth.js"></script>
<script>
  // ログインしていなければログイン画面へ（ログイン後は元の画面に戻る）
  window.SESSION = window.Auth ? Auth.read() : null;
  if (!window.SESSION) location.replace('login.html?next=' + encodeURIComponent(/^#[a-z]{1,12}$/.test(location.hash) ? location.hash : ''));
</script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="代車管理くん">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="style.css">
<header class="topbar">
  <div class="brand"><img class="logo" src="logo.svg" alt="" width="36" height="36"><div>代車管理くん<small id="today"></small></div></div>
  <nav class="seg" id="nav">
    <button data-view="dashboard"><span class="l">ダッシュボード</span><span class="s">ホーム</span></button>
    <button data-view="day"><span class="l">日別</span><span class="s">日別</span></button>
    <button data-view="period"><span class="l">期間</span><span class="s">期間</span></button>
    <button data-view="ledger"><span class="l">台帳</span><span class="s">台帳</span></button>
    <button data-view="search"><span class="l">空き検索</span><span class="s">空き</span></button>
    <button data-view="master"><span class="l">車両マスタ</span><span class="s">車両</span></button>
  </nav>
  <button class="btn tonal tvbtn" id="tvBtn" title="事務所のモニター向けの大画面表示">ボード表示</button>
  <button class="btn primary" id="newLoan">＋ 新規貸出</button>
</header>

<main id="main"></main>

<dialog id="loanDlg">
  <form method="dialog" id="loanForm">
    <h2 id="loanTitle">貸出</h2>
    <div class="grid2">
      <label>区分
        <select name="type">
          <option value="loan">貸出</option>
          <option value="corp">社用</option>
          <option value="ng">使用不可（修理・点検など）</option>
        </select>
      </label>
      <label>車両 <select name="vehicleId" required></select></label>
      <label>お客様名 <input name="customer" placeholder="例：山田様"></label>
      <label>担当 <select name="staff"></select></label>
      <label>開始 <input type="datetime-local" name="start" required></label>
      <label>終了（返却予定） <input type="datetime-local" name="end"></label>
    </div>
    <label id="reasonRow" style="margin-top:12px">用件（なぜ貸し出すか）
      <input name="reason" maxlength="30" placeholder="例：車検、板金修理、事故修理…" autocomplete="off">
    </label>
    <div class="chips" id="reasonChips" style="margin-top:8px"></div>
    <label id="purposeRow" style="margin-top:12px">保険の扱い
      <select name="purpose">
        <option value="normal">通常の代車（無償の貸出）</option>
        <option value="insurance">保険対応（事故・保険修理など）</option>
      </select>
    </label>
    <div class="presets" id="presets">終了をすばやく設定:
      <button type="button" class="chip" data-preset="h2">+2時間</button>
      <button type="button" class="chip" data-preset="h4">+4時間</button>
      <button type="button" class="chip" data-preset="eod">今日18時</button>
      <button type="button" class="chip" data-preset="d1">+1日</button>
      <button type="button" class="chip" data-preset="d3">+3日</button>
    </div>
    <div class="checks">
      <label><input type="checkbox" name="undecided"> 返却未定（板金など）</label>
      <label><input type="checkbox" name="returned"> 返却済</label>
      <label><input type="checkbox" name="cancelled"> 取消</label>
    </div>
    <label>メモ <textarea name="note" rows="2"></textarea></label>
    <div id="loanWarn" class="warn" hidden></div>
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="loanDelete">削除</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="loanCancel">閉じる</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="vehDlg">
  <form method="dialog" id="vehForm">
    <h2 id="vehTitle">車両</h2>
    <div class="grid2">
      <label>車両ID <input name="id" required></label>
      <label>車名 <input name="name" required></label>
      <label>ナンバー <input name="plate"></label>
      <label>登録区分
        <select name="category"><option>代車</option><option>レンタカー</option></select>
      </label>
      <label>車検期限 <input type="date" name="inspection"></label>
      <label class="inline"><input type="checkbox" name="active" checked> 使用中（オフで一覧から除外）</label>
    </div>
    <fieldset class="oil">
      <legend>オイル交換</legend>
      <div class="grid2">
        <label>前回の交換日 <input type="date" name="oilLastDate"></label>
        <label>前回交換時の走行距離（km） <input type="number" name="oilLastKm" min="0" inputmode="numeric"></label>
        <label>現在の走行距離（km） <input type="number" name="odo" min="0" inputmode="numeric"></label>
        <label>交換の目安（月ごと） <input type="number" name="oilMonths" min="1" inputmode="numeric" value="6"></label>
        <label>交換の目安（kmごと） <input type="number" name="oilKm" min="500" step="500" inputmode="numeric" value="5000"></label>
        <div class="oil-act"><button type="button" class="btn tonal" id="oilDone">交換した（今日）</button></div>
      </div>
      <div id="oilStatus" class="hint"></div>
    </fieldset>
    <label>メモ（保険・登録費用など） <textarea name="note" rows="3"></textarea></label>
    <section id="vehHist" hidden style="margin-top:18px">
      <h3>貸出履歴</h3>
      <div id="vehHistSum" class="hint" style="margin-bottom:6px"></div>
      <ul class="list" id="vehHistList"></ul>
    </section>
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="vehDelete">削除</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="vehCancel">閉じる</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="askDlg">
  <p id="askMsg" style="margin-top:0"></p>
  <div class="dlg-actions"><span class="spacer"></span>
    <button type="button" class="btn" id="askNo">キャンセル</button>
    <button type="button" class="btn primary" id="askYes">OK</button></div>
</dialog>
<div id="toast" hidden></div>

<script src="app.js"></script>
