<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ログイン｜代車管理くん</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;
    padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .login-card{width:min(420px,100%);background:#fff;border-radius:28px;padding:36px 30px 28px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 18px 50px rgba(0,0,0,.08)}
  .login-head{text-align:center;margin-bottom:26px}
  .login-head img{width:76px;height:76px;border-radius:21px;display:block;margin:0 auto 14px}
  .login-head h1{margin:0;font-size:24px;letter-spacing:.02em}
  .login-head p{margin:6px 0 0;color:var(--sub);font-size:14px;text-wrap:balance}
  .login-note{text-wrap:balance}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:13px;color:var(--sub)}
  .field input{min-height:48px;font-size:16px;border-radius:12px}
  .pw{position:relative}
  .pw input{padding-right:64px}
  .pw button{position:absolute;right:6px;top:6px;height:36px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;border-radius:8px;cursor:pointer;padding:0 10px}
  .pw button:hover{background:#eef5ff}
  .keep{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px;margin:2px 0 18px;cursor:pointer}
  .keep input{width:18px;height:18px;min-height:0;margin:0}
  .login-btn{width:100%;min-height:50px;font-size:16px;border-radius:14px}
  .login-err{min-height:22px;margin:0 0 12px;color:#c4241a;font-size:13px;line-height:1.5}
  .login-note{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
  .login-card.shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  @media (prefers-reduced-motion:reduce){.login-card.shake{animation:none}}
</style>
<script src="accounts.js"></script>
<script src="auth.js"></script>
<script>
  // すでにログイン済みなら、そのままアプリへ
  if (window.Auth && Auth.read()) {
    var nx = new URLSearchParams(location.search).get('next') || '';
    location.replace('index.html' + (/^#[a-z]{1,12}$/.test(nx) ? nx : ''));
  }
</script>
</head>
<body>
<main class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="on" novalidate>
    <div class="login-head">
      <img src="logo.svg" alt="" width="76" height="76">
      <h1>代車管理くん</h1>
      <p>店舗IDとパスワードでログインしてください</p>
    </div>
    <label class="field">店舗ID
      <input id="shop" name="username" type="text" inputmode="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    </label>
    <label class="field">パスワード
      <span class="pw">
        <input id="pass" name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="togglePw" aria-label="パスワードを表示" aria-pressed="false">表示</button>
      </span>
    </label>
    <label class="keep"><input type="checkbox" id="keep"> この端末でログイン状態を保つ（30日間）</label>
    <p class="login-err" id="err" role="alert" aria-live="assertive"></p>
    <button class="btn primary login-btn" id="submit" type="submit">ログイン</button>
    <p class="login-note">ログイン情報は、お渡ししたものをご利用ください。<br>共有のパソコンでは、使い終わったらログアウトしてください。</p>
  </form>
</main>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var form = $('loginForm'), err = $('err'), btn = $('submit');
    var MSG = {
      bad: '店舗IDまたはパスワードが違います。',
      locked: '続けて間違えたため、少し待ってからもう一度お試しください。',
      unsupported: 'この環境ではログインを利用できません。ブラウザを更新するか、別のブラウザでお試しください。',
      empty: '店舗IDとパスワードを入力してください。'
    };
    $('togglePw').addEventListener('click', function () {
      var show = $('pass').type === 'password';
      $('pass').type = show ? 'text' : 'password';
      this.textContent = show ? '隠す' : '表示';
      this.setAttribute('aria-pressed', show ? 'true' : 'false');
      this.setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
    });
    function fail(key) {
      err.textContent = MSG[key];
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      $('pass').focus(); $('pass').select();
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      if (!$('shop').value.trim() || !$('pass').value) { fail('empty'); return; }
      btn.disabled = true; btn.textContent = '確認しています…';
      Auth.login($('shop').value, $('pass').value, $('keep').checked).then(function (r) {
        if (r === 'ok') {
          var next = new URLSearchParams(location.search).get('next') || '';
          location.replace('index.html' + (/^#[a-z]{1,12}$/.test(next) ? next : ''));
        } else { btn.disabled = false; btn.textContent = 'ログイン'; fail(r); }
      });
    });
    if (Auth.lockedMs() > 0) err.textContent = MSG.locked;
  })();
</script>
</body>
</html>
